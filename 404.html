<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="5;url=https://omc-for-philips.github.io/briefing-portal/">
    <meta name="robots" content="noindex">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/briefing-portal/favicon.ico">
    <title>Redirecting | Philips Briefing Portal</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 32px;
        overflow: hidden;
        background:
          linear-gradient(145deg, rgba(0, 45, 116, 0.2), transparent 45%),
          linear-gradient(160deg, #2175e9 0%, #0b5ed7 48%, #073b8f 100%);
        color: #fff;
        font-family: Roboto, Arial, sans-serif;
        text-align: center;
      }

      main {
        display: flex;
        align-items: center;
        flex-direction: column;
      }

      h1 {
        max-width: 680px;
        margin: 0 0 18px;
        color: #fff;
        font-size: clamp(1.8rem, 4vw, 2.8rem);
        font-weight: 400;
        letter-spacing: -0.025em;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: rgba(255, 255, 255, 0.88);
        font-size: clamp(1.05rem, 2.5vw, 1.35rem);
        line-height: 1.6;
      }

      strong {
        display: inline-block;
        min-width: 1.2ch;
        color: #fff;
        font-size: 1.3em;
        font-variant-numeric: tabular-nums;
      }

      a {
        margin-top: 18px;
        color: rgba(255, 255, 255, 0.78);
        font-size: 0.85rem;
        text-underline-offset: 4px;
      }

      a:hover,
      a:focus-visible {
        color: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sorry but you need to login to view this content</h1>
      <p role="status" aria-live="polite">
        Redirecting you to login in <strong id="countdown">5</strong>
        <span id="countdown-unit">seconds</span>&hellip;
      </p>
      <a href="https://omc-for-philips.github.io/briefing-portal/">Go to login now</a>
    </main>

    <script>
      (function startRedirectCountdown() {
        const portalUrl = 'https://omc-for-philips.github.io/briefing-portal/'
        const countdown = document.getElementById('countdown')
        const countdownUnit = document.getElementById('countdown-unit')
        let secondsRemaining = 5

        const interval = window.setInterval(function updateCountdown() {
          secondsRemaining -= 1
          countdown.textContent = String(secondsRemaining)
          countdownUnit.textContent = secondsRemaining === 1 ? 'second' : 'seconds'

          if (secondsRemaining <= 0) {
            window.clearInterval(interval)
            window.location.replace(portalUrl)
          }
        }, 1000)
      })()
    </script>
  </body>
</html>
