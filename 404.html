<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="3;url=https://omc-for-philips.github.io/briefing-portal/">
    <meta name="robots" content="noindex">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/briefing-portal/favicon.ico">
    <title>Page not found | Philips Briefing Portal</title>
    <style>
      :root {
        color: #172533;
        font-family: Roboto, Arial, sans-serif;
        font-synthesis: none;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top left, rgba(11, 94, 215, 0.16), transparent 38%),
          #f6f9fc;
      }

      main {
        width: min(100%, 520px);
        padding: 48px 40px;
        border: 1px solid #dce5ef;
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 20px 55px rgba(23, 51, 83, 0.12);
        text-align: center;
      }

      .status {
        display: inline-grid;
        width: 76px;
        height: 76px;
        place-items: center;
        border-radius: 22px;
        background: #e9f2ff;
        color: #0b5ed7;
        font-size: 1.35rem;
        font-weight: 700;
      }

      h1 {
        margin: 24px 0 10px;
        color: #172b3f;
        font-size: clamp(1.65rem, 5vw, 2.2rem);
        line-height: 1.15;
      }

      p {
        margin: 0 auto;
        color: #607489;
        font-size: 1rem;
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        margin-top: 28px;
        padding: 0 22px;
        border-radius: 10px;
        background: #0b5ed7;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }

      a:hover,
      a:focus-visible {
        background: #084cae;
      }

      a:focus-visible {
        outline: 3px solid rgba(11, 94, 215, 0.3);
        outline-offset: 3px;
      }

      @media (max-width: 520px) {
        main {
          padding: 38px 24px;
          border-radius: 18px;
        }
      }
    </style>
    <script>
      window.setTimeout(function redirectToBriefingPortal() {
        window.location.replace('https://omc-for-philips.github.io/briefing-portal/')
      }, 1200)
    </script>
  </head>
  <body>
    <main>
      <span class="status" aria-hidden="true">404</span>
      <h1>Let&rsquo;s get you back on track</h1>
      <p>
        That page doesn&rsquo;t exist. You&rsquo;ll be returned to the Philips Briefing Portal.
      </p>
      <a href="https://omc-for-philips.github.io/briefing-portal/">
        Return to the briefing portal
      </a>
    </main>
  </body>
</html>
